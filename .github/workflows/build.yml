name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec', '.github/workflows/build.yml') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec', 'requirements') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-${{ steps.get-date.outputs.date }}-
            ${{ runner.os }}-buildozer-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure compatible 'sh' package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sh<2.0,>=1.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libltdl-dev libffi-dev libssl-dev autoconf libtool pkg-config cmake bc unzip zip

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.37 virtualenv
          python -m pip install python-for-android==2024.1.21
          python -m pip install buildozer

      - name: Print Python and p4a headers (DEBUG)
        run: |
          python -V
          python -m pip show python-for-android Cython buildozer sh || true
          ls -la .buildozer || true
          find .buildozer -maxdepth 4 -type d -name "python3*" -exec sh -c 'echo "=== {}"; ls -la {}/include || true' \; 2>/dev/null || true

      - name: Clean buildozer caches
        run: |
          rm -rf .buildozer .buildozer_global bin || true
          python -m pip cache purge || true

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Verify APK was created
        run: |
          ls -lah bin/*.apk 2>/dev/null && echo "✓ APK created successfully" || (echo "✗ APK not found" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Collect build logs on failure
        if: failure()
        run: |
          mkdir -p build_logs
          cp -r .buildozer/android/platform/build/*/dists/*/build/outputs/* build_logs/ 2>/dev/null || true
          cp .buildozer/applibs-android.txt build_logs/ 2>/dev/null || true
          find .buildozer -name "*.log" -type f -exec cp {} build_logs/ \; 2>/dev/null || true
          tar -czf ci_build_logs.tar.gz build_logs/
          ls -lh ci_build_logs.tar.gz || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build_logs.tar.gz
          if-no-files-found: ignore
